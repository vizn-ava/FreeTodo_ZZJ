[project]
name = "lifetrace"
version = "0.1.0"
description = "LifeTrace - A cross-platform screen recording and activity tracking application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core dependencies
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "python-multipart>=0.0.6",   # 鏂囦欢涓婁紶鏀寔锛團orm data锛?
    # Screenshot and image processing
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.0",
    # OCR processing (rapidocr requires numpy)
    "rapidocr-onnxruntime",
    "numpy>=1.21.0,<2.0.0", # 闄愬埗鍒?1.x 鐗堟湰浠ョ‘淇?PyInstaller 鍏煎鎬?
    # Audio processing (for ASR WebSocket stream)
    # 娉ㄦ剰锛氫娇鐢?av 搴擄紙online-asr 鐨勪緷璧栵級杩涜闊抽澶勭悊锛屼笉闇€瑕?pydub
    # online-asr 璇煶璇嗗埆锛堟帹鑽愶紝宸插疄鐜帮級
    "dashscope>=1.24.0", # 瀹炴椂璇煶璇嗗埆锛屼笉闇€瑕?Visual C++ 鏋勫缓宸ュ叿锛堝寘鍚?av 搴擄級
    "av>=13.0.0",
    # WhisperLiveKit 瀹炴椂璇煶璇嗗埆锛堣秴浣庡欢杩燂紝鏀寔鍙戣█鑰呭尯鍒嗭級
    "websockets>=12.0",      # WebSocket 瀹㈡埛绔紙鐢ㄤ簬杩炴帴 WhisperLiveKit 鏈嶅姟鍣級
    "pyannote.audio>=3.1.0", # 璇磋瘽浜哄垎绂伙紙鍙€夛級
    # 绻佺畝杞崲锛堝彲閫夛紝鐢ㄤ簬灏嗙箒浣撲腑鏂囪浆鎹负绠€浣擄級
    "opencc-python-reimplemented>=0.1.7", # 绻佺畝杞崲搴?
    # FunASR 璇煶璇嗗埆锛堝彲閫夛紝闇€瑕?Visual C++ 鏋勫缓宸ュ叿锛?
    # 濡傛灉瀹夎澶辫触锛岀郴缁熼煶棰戝疄鏃惰瘑鍒姛鑳藉皢涓嶅彲鐢?
    # 瀹夎鏂规硶锛?
    # 1. 瀹夎 Visual C++ 鏋勫缓宸ュ叿锛歨ttps://visualstudio.microsoft.com/visual-cpp-build-tools/
    # 2. 杩愯锛歱ip install funasr
    # "funasr>=1.0.0",  # 娉ㄩ噴鎺夛紝浣滀负鍙€変緷璧?
    # Data processing
    "pyyaml>=6.0",
    "sentence-transformers>=2.2.0", # 鏂囨湰宓屽叆妯″瀷
    "chromadb>=0.4.0",              # 鍚戦噺鏁版嵁搴?
    "scipy>=1.9.0",                 # 绉戝璁＄畻锛堢敤浜庝綑寮﹁窛绂伙級
    "hdbscan>=0.8.0",               # 鏂囨湰鑱氱被绠楁硶
    # Scheduler
    "apscheduler>=3.10.0",
    # Utils
    "psutil>=5.9.0",
    # OpenAI API
    "openai>=1.0.0",
    # Tavily API for web search
    "tavily-python>=0.5.0",
    # Configuration management with hot reload support (includes yaml support)
    "dynaconf[yaml]>=3.2.0",
    # Logging
    "loguru>=0.7.3",
    # macOS specific dependencies (only install on macOS)
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9.0; sys_platform == 'darwin'",
    # Windows specific dependencies (only install on Windows)
    "pywin32>=306; sys_platform == 'win32'",
]

# Ruff 閰嶇疆 - Python linter 鍜?formatter
[tool.ruff]
# 姣忚鏈€澶у瓧绗︽暟锛堥粯璁?88锛屽彲浠ユ牴鎹渶瑕佽皟鏁达級
line-length = 100

# 鐩爣 Python 鐗堟湰
target-version = "py313"

# 鎺掗櫎鐨勭洰褰?
exclude = [".git", ".venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# 鍚敤鐨勮鍒欓泦
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PLR", # Pylint refactoring (鍖呭惈澶嶆潅搴︽鏌?
    "C90", # mccabe (澶嶆潅搴︽鏌?
]

# 蹇界暐鐨勮鍒?
ignore = [
    "E501", # 琛屽お闀匡紙宸茬粡閫氳繃 line-length 鎺у埗锛?
    "B008", # 鍏佽鍦ㄥ嚱鏁板弬鏁伴粯璁ゅ€间腑浣跨敤鍑芥暟璋冪敤锛團astAPI Depends 妯″紡锛?
]

# Pylint 澶嶆潅搴﹂厤缃?
[tool.ruff.lint.pylint]
# 鍑芥暟鏈€澶ц鍙ユ暟锛堣蒋闄愬埗锛?0锛岀‖闄愬埗锛?00锛?
max-statements = 50
# 鍑芥暟鏈€澶у弬鏁版暟
max-args = 7
# 鍑芥暟鏈€澶ц繑鍥炶鍙ユ暟
max-returns = 6
# 鍑芥暟鏈€澶у垎鏀暟
max-branches = 12
# 绫讳腑鏈€澶у叕鍏辨柟娉曟暟锛堝府鍔╂帶鍒跺崟涓枃浠跺ぇ灏忥級
max-public-methods = 20

# McCabe 澶嶆潅搴﹂厤缃?
[tool.ruff.lint.mccabe]
# 鏈€澶у湀澶嶆潅搴︼紙杞檺鍒讹細10锛岀‖闄愬埗锛?5锛?
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# 娴嬭瘯鏂囦欢鍙互浣跨敤 assert
"tests/*.py" = ["S101"]

[tool.ruff.format]
# 浣跨敤鍙屽紩鍙?
quote-style = "double"

# 缂╄繘浣跨敤 4 涓┖鏍?
indent-style = "space"

# uv 閰嶇疆 - 鍖呯鐞嗗櫒闀滃儚婧?
[tool.uv]
# 浣跨敤娓呭崕澶у PyPI 闀滃儚婧愶紙鍥藉唴璁块棶閫熷害蹇級
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
# 寮€鍙戝伐鍏?
dev = [
    "pre-commit>=4.4.0",
    "ruff>=0.14.4",
    "pyinstaller>=6.0.0",
]


